name: ARMv7 Lite Build

# Builds optimization artifacts for low-end 32-bit ARM devices.
#   - libphira.so  : the native library used by the Phira Android shell
#   - phira-main   : a runnable Linux x86-64 binary (sanity check / fallback)
#
# Artifacts are kept for 14 days. This workflow is not a release pipeline.

on:
  workflow_dispatch:
  push:
    branches: [optimize-armv7-lite]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'prpr/**'
      - 'phira/**'
      - 'scripts/build_armv7_lite.sh'
      - '.github/workflows/armv7-lite-build.yml'

permissions:
  contents: read

concurrency:
  group: armv7-lite-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  android-armv7:
    name: android-armv7 (libphira.so)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        env:
          SKIP_JDK_VERSION_CHECK: 'true'

      - name: Install Android NDK (r25c, supports armv7 + API 21)
        run: |
          sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add armv7-linux-androideabi
          rustc --version
          echo "NDK: $ANDROID_NDK_HOME"

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: armv7-lite

      - name: Build libphira.so (lite / optimized)
        run: ./scripts/build_armv7_lite.sh

      - name: Show artifact
        run: file target/armv7-linux-androideabi/release/libphira.so

      - name: Upload libphira.so
        uses: actions/upload-artifact@v4
        with:
          name: phira-libphira-armv7-lite
          path: target/armv7-linux-androideabi/release/libphira.so
          if-no-files-found: error
          retention-days: 14

  linux-x86_64:
    name: linux-x86_64 (phira-main)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librust-alsa-sys-dev libglib2.0-dev libasound2-dev \
            libatk1.0-dev libgtk-3-dev

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustc --version

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-lite

      - name: Build phira-main (release)
        run: cargo build --release -p phira-main

      - name: Upload phira-main
        uses: actions/upload-artifact@v4
        with:
          name: phira-main-linux-x86_64
          path: target/release/phira-main
          if-no-files-found: error
          retention-days: 14
