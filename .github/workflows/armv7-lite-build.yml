name: ARMv7 Lite Build

# Builds optimization artifacts for low-end 32-bit ARM devices.
#   - libphira.so  : the native library used by the Phira Android shell
#   - phira-main   : a runnable Linux x86-64 binary (sanity check / fallback)
#
# Artifacts are kept for 14 days. This workflow is not a release pipeline.

on:
  workflow_dispatch:
  push:
    branches: [optimize-armv7-lite]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'prpr/**'
      - 'phira/**'
      - 'scripts/build_armv7_lite.sh'
      - '.github/workflows/armv7-lite-build.yml'

permissions:
  contents: read

concurrency:
  group: armv7-lite-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  android-armv7:
    name: android-armv7 (libphira.so)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK & NDK
        env:
          SKIP_JDK_VERSION_CHECK: 'true'
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK_ROOT=$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort | tail -1)
          if [[ -z "$SDKMANAGER" ]]; then SDKMANAGER=$(command -v sdkmanager); fi
          echo "SDKMANAGER=$SDKMANAGER"
          # Accept all SDK licenses non-interactively, then install NDK r25c + build-tools.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;25.2.9519653" "build-tools;33.0.2"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add armv7-linux-androideabi
          rustc --version
          echo "NDK: $ANDROID_NDK_HOME"

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: armv7-lite

      - name: Build libphira.so (lite / optimized)
        run: ./scripts/build_armv7_lite.sh

      - name: Show artifact
        run: file target/armv7-linux-androideabi/release/libphira.so

      - name: Upload libphira.so
        uses: actions/upload-artifact@v4
        with:
          name: phira-libphira-armv7-lite
          path: target/armv7-linux-androideabi/release/libphira.so
          if-no-files-found: error
          retention-days: 14

      - name: Download stock v0.8.3 armeabi-v7a APK
        run: |
          curl -fL --retry 3 -o stock.apk \
            https://github.com/TeamFlos/phira/releases/download/v0.8.3/Phira-android-armeabi-v7a-v0.8.3.apk
          ls -lh stock.apk

      - name: Repackage APK with optimized libphira.so
        run: |
          set -euo pipefail
          WORKDIR=$(mktemp -d)
          cd "$WORKDIR"
          unzip -q "$GITHUB_WORKSPACE/stock.apk"
          cp "$GITHUB_WORKSPACE/target/armv7-linux-androideabi/release/libphira.so" lib/armeabi-v7a/libphira.so
          # Strip stock signature; APK must be re-signed after modification.
          rm -f META-INF/MANIFEST.MF META-INF/*.SF META-INF/*.RSA META-INF/*.DSA META-INF/*.EC
          # Repackage: store .so uncompressed, deflate everything else.
          zip -q -r "$WORKDIR/unsigned.apk" . -x 'lib/armeabi-v7a/libphira.so'
          zip -q -0 "$WORKDIR/unsigned.apk" lib/armeabi-v7a/libphira.so
          BT="$ANDROID_SDK_ROOT/build-tools/33.0.2"
          "$BT/zipalign" -f -p 4 "$WORKDIR/unsigned.apk" "$WORKDIR/aligned.apk"
          keytool -genkeypair -v -keystore phira.jks -alias phira \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Phira ARMv7 Lite, OU=Community, O=Phira, L=NA, ST=NA, C=CN" > /dev/null 2>&1
          "$BT/apksigner" sign --ks phira.jks --ks-pass pass:android --key-pass pass:android \
            --min-sdk-version 21 --out "$GITHUB_WORKSPACE/phira-armv7-lite.apk" "$WORKDIR/aligned.apk"
          echo "APK built:"
          ls -lh "$GITHUB_WORKSPACE/phira-armv7-lite.apk"
          "$BT/apksigner" verify --verbose --print-certs "$GITHUB_WORKSPACE/phira-armv7-lite.apk" | head -20

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: phira-armv7-lite-apk
          path: phira-armv7-lite.apk
          if-no-files-found: error
          retention-days: 14

  linux-x86_64:
    name: linux-x86_64 (phira-main)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librust-alsa-sys-dev libglib2.0-dev libasound2-dev \
            libatk1.0-dev libgtk-3-dev

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustc --version

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-lite

      - name: Build phira-main (release)
        run: cargo build --release -p phira-main

      - name: Upload phira-main
        uses: actions/upload-artifact@v4
        with:
          name: phira-main-linux-x86_64
          path: target/release/phira-main
          if-no-files-found: error
          retention-days: 14
